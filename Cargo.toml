[workspace]
resolver = "2"
members = [
    "crates/*",
    "src-tauri",
]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.85"
authors = ["Lucas Amion"]
license = "MIT"
repository = "https://github.com/LucasAmion/wizzard"
homepage = "https://github.com/LucasAmion/wizzard"

[workspace.dependencies]
palette = "0.7.7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", default-features = false }
wizlight = { version = "0.1.1", default-features = false }
